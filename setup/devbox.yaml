

- name: Install development box tools.
  hosts: all 
  become: yes
  roles:
    - ros
    - common
  tasks:
  - name: Install ROS2 desktop packages.
    apt:
      name:
        - ros-lyrical-rviz2
        - ros-lyrical-desktop-full
        - python3-colcon-common-extensions
        - python3-venv 
        - python3-rosdep
        - gcc-arm-none-eabi 
        - libnewlib-arm-none-eabi 
        - cmake 
        - doxygen 
      state: present

